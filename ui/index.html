<style>
/* Loading skeleton: shown until app.js draws the sidebar, header and page into these regions (it replaces them). */
.sk{display:block;border-radius:6px;background:var(--sk,#eceef3);position:relative;overflow:hidden}
:root[data-theme=dark] .sk{--sk:#25272c}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sk 1.4s ease-in-out infinite}
:root[data-theme=dark] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
@keyframes sk{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}}
.sk-nav{display:grid;gap:14px;padding:18px 16px}
.sk-nav .sk-row{display:flex;align-items:center;gap:10px}
.sk-top{display:flex;align-items:center;gap:10px;height:100%;padding:0 24px}
.sk-page{max-width:1120px;margin:0 auto;padding:40px 32px;display:grid;gap:20px}
.sk-card{border:1px solid var(--sk-line,#eceef3);border-radius:12px;padding:20px;display:grid;gap:14px}
:root[data-theme=dark] .sk-card{--sk-line:#2c2f35}
.sk-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.sk-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.sk-stats{grid-template-columns:1fr 1fr}.sk-cols{grid-template-columns:1fr}.sk-page{padding:24px 16px}}
.sk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
