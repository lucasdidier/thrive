<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex">
<title>Checkout — Thrive</title><link rel="icon" href="/favicon.svg">
<script src="/appearance.js"></script>
<link rel="stylesheet" href="/typography.css"><link rel="stylesheet" href="/auth.css">
</head>
<body data-paddle-token="__PADDLE_TOKEN__" data-app-url="__APP_URL__">
<div class="auth-layout checkout-layout">
 <section class="auth-side">
  <header class="auth-header"><a href="/" class="brand" aria-label="Thrive home"><img src="/favicon.svg" alt="" width="28" height="28">thrive</a></header>

   <div class="auth-card">
    <h1 id="checkout-heading">Opening checkout…</h1>

   </div>
  </main>
 </section>
</div>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script type="module" src="/paddle-checkout.js"></script>
